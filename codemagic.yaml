# Codemagic CI/CD for Ick (Capacitor 8 + React + Vite).
#
# Two workflows:
#   - ios-workflow      → builds iOS .ipa, uploads to App Store Connect / TestFlight
#   - android-workflow  → builds signed AAB, uploads to Google Play (optional)
#
# Prerequisites (set in Codemagic UI, not here):
#
#   iOS:
#     - Apple Developer team_id + bundle identifier "com.ickthatish.app"
#     - "App Store Connect API Key" integration configured
#     - Automatic code signing enabled (or manual cert/profile uploaded)
#
#   Android:
#     - Upload your keystore.jks to Codemagich
#     - Set env vars in encrypted "keystore_credentials" group:
#         CM_KEYSTORE_PATH       (auto by Codemagic)
#         CM_KEYSTORE_PASSWORD
#         CM_KEY_ALIAS
#         CM_KEY_PASSWORD
#     - For Play Store publishing: upload service-account JSON
#
# Repo layout:
#   frontend/  → Vite + React app with Capacitor config
#   The ios/ and android/ native folders are gitignored; Capacitor
#   regenerates them on each build via `cap add` + `cap sync`.

workflows:
  # ============================================================
  # iOS WORKFLOW
  # ============================================================
  ios-workflow:
    name: Ick iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key   # name configured in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ickthatish.app
      vars:
        # Capacitor 8 uses Swift Package Manager, not CocoaPods. The
        # workspace file no longer exists — we build the .xcodeproj
        # directly. Xcode resolves SPM packages automatically.
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.ickthatish.app"
        # Baked into the bundle at `npm run build` time. Without it api.js falls
        # back to the relative '/api', which on a device resolves against the
        # WebView origin (capacitor://localhost) instead of the server — every
        # request 404s in a build that otherwise looks fine.
        VITE_API_URL: "https://ickthatish.com/api"
        # Numeric App Store App ID — not sensitive (visible in every
        # TestFlight + App Store URL). Used to auto-increment the
        # build number from the latest TestFlight/App Store build.
        APP_STORE_APP_ID: "6769029765"
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install frontend deps
        script: |
          cd frontend
          npm ci

      - name: Build web (Vite)
        script: |
          cd frontend
          npm run build

      - name: Set up Capacitor iOS native project
        script: |
          cd frontend
          # Capacitor 8 generates an SPM-based iOS project (no Podfile,
          # no .xcworkspace). cap add ios is not idempotent — always
          # nuke + re-add for a clean slate.
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          echo "----- ios/App contents -----"
          ls -la ios/App
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: cap add ios did not produce App.xcodeproj" >&2
            exit 1
          fi

      - name: Add camera + photo permission usage strings
        script: |
          cd frontend/ios/App/App
          # The Info.plist `cap add ios` generates has NO usage descriptions.
          # iOS terminates an app the moment it touches the camera without
          # NSCameraUsageDescription, and barcode scanning is the core feature,
          # so without this the app crashes on the Scan tab and fails review.
          # ios/ is gitignored and rebuilt every run, so this has to happen here.
          PLIST=Info.plist
          set_str() {
            /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST"
          }
          set_str NSCameraUsageDescription \
            "Ick uses the camera to scan product barcodes and receipts so it can look up ingredients and health scores."
          set_str NSPhotoLibraryUsageDescription \
            "Ick needs access to your photos so you can upload a receipt image and add those products to your pantry."

          for KEY in NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              echo "ERROR: $KEY missing from Info.plist" >&2
              exit 1
            fi
          done
          echo "----- usage strings -----"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"

      - name: Generate app icon + splash screen
        script: |
          cd frontend
          # `cap add ios` above scaffolds a fresh project carrying Capacitor's
          # placeholder icon. ios/ is gitignored, so nothing we commit survives
          # into it — the branded assets have to be regenerated here, after the
          # native project exists and before xcodebuild runs. Apple rejects
          # builds that ship the default placeholder icon.
          node scripts/generate-icons.js
          npx capacitor-assets generate --ios
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICONSET/AppIcon-512@2x.png" ]; then
            echo "ERROR: capacitor-assets did not write the 1024 marketing icon" >&2
            ls -la "$ICONSET" || true
            exit 1
          fi
          echo "----- generated AppIcon.appiconset -----"
          ls -la "$ICONSET"

      - name: Resolve Swift Package dependencies
        script: |
          # Xcode normally resolves SPM deps automatically during build,
          # but pre-resolving makes failures more legible (network /
          # checksum issues surface here, not during xcodebuild).
          cd frontend/ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Set build number (auto-increment from App Store Connect)
        script: |
          cd frontend/ios/App
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
            NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
            agvtool new-version -all $NEW_BUILD_NUMBER
            echo "Set build number to $NEW_BUILD_NUMBER"
          else
            echo "APP_STORE_APP_ID not set — skipping auto-increment (build will use the default 1)"
          fi

      - name: Fetch + install signing files (cert + provisioning profile)
        script: |
          # Codemagic's app_store_connect integration handles credentials,
          # but we still need to download the provisioning profile, add
          # the cert to the build keychain, and have xcode-project write
          # the export_options.plist that build-ipa reads.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build .ipa with xcodebuild
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      # xcode-project build-ipa writes to build/ios/ipa relative to the
      # repo root (where xcodebuild is invoked from), NOT next to the
      # .xcodeproj. Prior glob was frontend/ios/App/build/ios/ipa/*.ipa
      # and matched nothing, so Codemagic logged "no IPAs or PKGs found"
      # and skipped the TestFlight upload while still reporting success.
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      # email:
      #   recipients:
      #     - dairystatebreaks@gmail.com
      #   notify:
      #     success: true
      #     failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # automatic TestFlight upload
        # submit_to_app_store: false   # set true when ready to ship to App Store review

  # ============================================================
  # ANDROID WORKFLOW (optional — you may already build locally)
  # ============================================================
  android-workflow:
    name: Ick Android Build
    max_build_duration: 60
    # mac_mini_m2 matches the iOS workflow so we stay within the free
    # tier's macOS-minute pool. Android builds fine on macOS — just
    # needs Gradle + Java. Switch to linux_x2 if you upgrade plans.
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference   # name your keystore exactly "keystore_reference" in Codemagic UI
      vars:
        PACKAGE_NAME: "com.ickthatish.app"
        # See the note in ios-workflow — the relative '/api' fallback is dead
        # on a device, so the real origin has to be baked in at build time.
        VITE_API_URL: "https://ickthatish.com/api"
      node: 22
      # Capacitor 8's generated android build.gradle declares
      # sourceCompatibility/targetCompatibility = JavaVersion.VERSION_21,
      # so the runner needs JDK 21. Older Cap (6/7) only needed 17.
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install frontend deps
        script: |
          cd frontend
          npm ci

      - name: Build web (Vite)
        script: |
          cd frontend
          npm run build

      - name: Set up Capacitor Android project
        script: |
          cd frontend
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add camera + notification permissions to the manifest
        script: |
          cd frontend/android/app/src/main
          # `cap add android` generates a manifest declaring only INTERNET.
          # Without CAMERA the barcode scanner — the core feature — cannot open
          # the camera at all, and POST_NOTIFICATIONS is required to prompt for
          # push on Android 13+. android/ is gitignored and rebuilt every run,
          # so a locally-patched manifest never reaches this build.
          MANIFEST=AndroidManifest.xml
          if grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "camera permission already present — leaving manifest alone"
          else
            perl -i -0pe 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>|' "$MANIFEST"
          fi
          for PERM in CAMERA POST_NOTIFICATIONS; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST"; then
              echo "ERROR: $PERM missing from AndroidManifest.xml" >&2
              exit 1
            fi
          done
          echo "----- manifest permissions -----"
          grep "uses-permission\|uses-feature" "$MANIFEST"

      - name: Generate app icon + splash screen
        script: |
          cd frontend
          # android/ is gitignored, so `cap add android` scaffolds a fresh
          # project carrying Capacitor's placeholder launcher icon. Regenerate
          # the branded icons + splash here, after the native project exists
          # and before bundleRelease. Play rejects placeholder icons.
          node scripts/generate-icons.js
          npx capacitor-assets generate --android
          FG="android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
          if [ ! -f "$FG" ]; then
            echo "ERROR: capacitor-assets did not write the adaptive launcher icon" >&2
            exit 1
          fi
          echo "----- generated launcher icons -----"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: Set Gradle versionCode (auto-increment)
        script: |
          cd frontend/android/app
          # Codemagic exposes BUILD_NUMBER per build. We use perl instead
          # of sed because BSD sed (macOS) needs `-i ''` while GNU sed
          # (Linux) needs `-i` with no arg — perl's -i syntax is identical
          # on both platforms.
          perl -i -pe "s/versionCode .*/versionCode $BUILD_NUMBER/" build.gradle
          grep "versionCode" build.gradle

      - name: Build signed AAB
        script: |
          cd frontend/android
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/*.apk

    # Publishing to Google Play is optional and requires a service-account
    # JSON. To enable, set up the credential in Codemagic UI (Integrations
    # → Google Play) and uncomment the block below.
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal       # internal | alpha | beta | production
    #     submit_as_draft: true
